syntax = "proto3";

package revocation;

option go_package = "github.com/moven0831/moica-revocation-smt/server/pkg/proto/revocation";

service RevocationProofService {
  rpc GetProof(GetProofRequest) returns (GetProofResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetProofRequest {
  string issuer_id = 1;
  string serial_number = 2;
}

message IndexedLeaf {
  string value = 1;
  string next_value = 2;
}

message GetProofResponse {
  string issuer_id = 1;
  string serial_number = 2;
  uint32 proof_type = 3;
  string root = 4;
  string value = 5;
  IndexedLeaf leaf = 6;
  uint64 leaf_index = 7;
  repeated string siblings = 8;
}

message GetStatusRequest {}

message GetStatusResponse {
  map<string, IssuerStatus> generations = 1;
  double uptime_seconds = 2;
}

message IssuerStatus {
  bool loaded = 1;
  int32 size = 2;
  int32 leaf_count = 3;
  int32 depth = 4;
  string root = 5;
  uint64 crl_number = 6;
  string loaded_at = 7;
}
